name: ping_market
description: Ping Market Android app
publish_to: "none"
version: 2.2.1+19

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#05050A"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_foreground_inset: 22
  min_sdk_android: 21

flutter_native_splash:
  color: "#05050A"
  image: assets/logo.png
  android: true
  ios: false
  android_12:
    color: "#05050A"
    image: assets/logo.png
    icon_background_color: "#05050A"
